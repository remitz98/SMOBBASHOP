name = "bba-store"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bba-store-db"
database_id = "072702ec-42a1-46f0-8697-da945b137f56"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bba-store-bucket"

[durable_objects]
bindings = [
  { name = "ORDER_NOTIFIER", class_name = "OrderNotifier" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderNotifier"]


# ========== STAGING ENVIRONMENT ==========

[env.staging]
workers_dev = true

[env.staging.assets]
directory = "./public"
binding = "ASSETS"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "bba-store-test-db"
database_id = "f41f051d-ba0d-414d-8f15-ccead88b89f0"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "bba-store-test-bucket"

[env.staging.vars]
ENVIRONMENT = "staging"
