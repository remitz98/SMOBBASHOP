name: Build Apps (Windows, macOS, Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            name: 'Windows'
          - platform: 'macos-latest'
            name: 'macOS'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || 'smobba123456' }}
        with:
          tagName: ''
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.zip
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/latest.json

      - name: Upload macOS App
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-macOS
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.tar.gz
            src-tauri/target/**/bundle/macos/*.sig
            src-tauri/target/**/latest.json

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android Native Kotlin APK
        run: |
          cd kmp-app
          gradle :assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist-apk
          find build/outputs/apk/release -name "*.apk" -exec cp {} ../dist-apk/SMO-BBA-SHOP.apk \;
          find build/outputs/apk/release -name "*.apk" -exec cp {} ../dist-apk/SMO-BBA-SHOP-debug.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-Android-APK
          path: dist-apk/*.apk

  release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Merge and generate latest.json for Tauri Auto-Updater
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const TAG = 'v2.3.9';
            const VERSION = '1.0.23';
            let merged = {
              version: VERSION,
              notes: 'SMO BBA SHOP ' + TAG + ' (Discord-style Auto-Update)',
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            function findFiles(dir) {
              let results = [];
              if (!fs.existsSync(dir)) return results;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) results = results.concat(findFiles(full));
                else results.push(full);
              }
              return results;
            }

            const allFiles = findFiles('all-dist');
            console.log('Artifacts found in all-dist:', allFiles);

            // Read any existing latest.json
            for (const f of allFiles) {
              if (path.basename(f) === 'latest.json') {
                try {
                  const data = JSON.parse(fs.readFileSync(f, 'utf8'));
                  if (data.platforms) Object.assign(merged.platforms, data.platforms);
                } catch (e) {
                  console.error('Failed reading', f, e);
                }
              }
            }

            // Look for Windows updater (exe or nsis.zip) and signature
            const winSig = allFiles.find(f => (f.endsWith('-setup.exe.sig') || f.endsWith('.exe.sig') || f.endsWith('.nsis.zip.sig')) && !f.includes('macos') && !f.includes('darwin'));
            const winTarget = allFiles.find(f => (f.endsWith('-setup.exe') || f.endsWith('.nsis.zip')) && !f.includes('macos') && !f.includes('darwin'));
            if (winTarget && winSig && !merged.platforms['windows-x86_64']) {
              const sig = fs.readFileSync(winSig, 'utf8').trim();
              const sanitizedWin = path.basename(winTarget).replace(/\s+/g, '.');
              merged.platforms['windows-x86_64'] = {
                signature: sig,
                url: 'https://github.com/remitz98/SMOBBASHOP/releases/download/' + TAG + '/' + sanitizedWin
              };
            }

            // Look for macOS updater tar.gz and signature
            const macTar = allFiles.find(f => f.endsWith('.tar.gz') || f.endsWith('.app.tar.gz'));
            const macSig = allFiles.find(f => f.endsWith('.tar.gz.sig') || f.endsWith('.app.tar.gz.sig'));
            if (macTar && macSig) {
              const sig = fs.readFileSync(macSig, 'utf8').trim();
              const sanitizedMac = path.basename(macTar).replace(/\s+/g, '.');
              merged.platforms['darwin-aarch64'] = {
                signature: sig,
                url: 'https://github.com/remitz98/SMOBBASHOP/releases/download/' + TAG + '/' + sanitizedMac
              };
              merged.platforms['darwin-x86_64'] = {
                signature: sig,
                url: 'https://github.com/remitz98/SMOBBASHOP/releases/download/' + TAG + '/' + sanitizedMac
              };
            }

            fs.writeFileSync('all-dist/latest.json', JSON.stringify(merged, null, 2));
            console.log('Final merged latest.json:\n', JSON.stringify(merged, null, 2));
          "

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.3.9"
          shopt -s globstar nullglob
          FILES=(all-dist/**/*.apk all-dist/**/*.msi all-dist/**/*.exe all-dist/**/*.dmg all-dist/**/*.zip all-dist/**/*.tar.gz all-dist/**/*.sig all-dist/**/latest.json)
          echo "Release files found:"
          ls -lh "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "SMO BBA SHOP v2.3.9 (Dark Mode for Desktop & Category Badge Contrast Fix)" \
              --notes "เวอร์ชัน v2.3.9: 1. รวมปุ่มสลับธีม มืด/สว่าง (Dark / Light Mode) เข้าสู่เวอร์ชัน Desktop (Windows & macOS) 2. ปรับแต่งป้ายหมวดหมู่เสื้อในโหมดมืดให้อ่านง่าย คมชัด ไม่กลืนกับพื้นหลังสีขาว 3. รองรับ Discord-style Auto Update บน Desktop 4. ระบบแจ้งเตือน Firebase Cloud Messaging (FCM) แบบ Push Notification บน Android" \
              "${FILES[@]}"
          fi
