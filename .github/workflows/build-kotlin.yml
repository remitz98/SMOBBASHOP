name: Build Kotlin Apps (Windows, macOS, Android)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        run: |
          cd kmp-app
          gradle :assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-Kotlin-Android-APK
          path: kmp-app/build/outputs/apk/**/*.apk

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows App
        run: |
          cd kmp-app
          gradle :packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-Kotlin-Windows
          path: |
            kmp-app/build/compose/binaries/main/**/*.msi
            kmp-app/build/compose/binaries/main/**/*.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build macOS DMG
        run: |
          cd kmp-app
          gradle :packageDmg --no-daemon --stacktrace

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-SHOP-Kotlin-macOS
          path: kmp-app/build/compose/binaries/main/**/*.dmg

  release-kotlin:
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all Kotlin artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.0-kotlin"
          shopt -s globstar nullglob
          gh release create "$TAG" \
            --title "SMO BBA SHOP v2.0.0 (Native Kotlin Edition)" \
            --notes "แอปพลิเคชันเวอร์ชันใหม่ Native Kotlin แท้ 100% สำหรับ Windows (.msi, .exe), macOS (.dmg), และ Android (.apk)" \
            all-dist/**/*.apk all-dist/**/*.msi all-dist/**/*.exe all-dist/**/*.dmg || \
          gh release upload "$TAG" all-dist/**/*.apk all-dist/**/*.msi all-dist/**/*.exe all-dist/**/*.dmg --clobber || true
